    :root {
      --bg: #F7F3EE;
      --card: #FFFFFF;
      --card-subtle: #F0EAE1;
      --border: #E8DFD3;
      --text-main: #2D2338;
      --text-muted: #847593;
      --purple: #8B5CF6;
      --lilac: #D8B4FE;
      --lilac-soft: #F3E8FF;
      --accent-binance: #F59E0B;
      --accent-usd: #10B981;
      --accent-eur: #6366F1;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: calc(75px + var(--safe-bottom));
      overflow-x: hidden;
    }

    header {
      padding: 0.85rem 1.15rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(247, 243, 238, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-title {

      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .app-logo-badge {

      height: 28px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app-logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .rate-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .rate-pill input {
      background: transparent;
      border: none;
      color: var(--purple);
      font-weight: 800;
      font-size: 0.85rem;
      width: 65px;
      text-align: right;
      outline: none;
    }

    .app-screen {
      max-width: 480px;
      margin: 0 auto;
      padding: 0.75rem 1.15rem;
      display: none;
    }

    .app-screen.active {
      display: block;
    }

    .hero-balance {
      text-align: center;
      padding: 0.8rem 0 0.5rem;
    }

    .hero-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
    }

    .hero-amount {
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--purple);
      margin: 0.15rem 0;
    }

    .diff-badge-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.4rem 0 0.8rem;
    }

    .diff-pill {
      display: inline-flex;

      padding: 0.3rem 0.65rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .diff-down { background: #FFF1F2; color: var(--danger); border: 1px solid #FECDD3; }
    .diff-zero { background: var(--card-subtle); color: var(--text-muted); border: 1px solid var(--border); }

    .btn-close-day {
      background: var(--lilac-soft);
      border: 1px solid var(--purple);

      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .chart-box {
      position: relative;
      width: 195px;
      height: 195px;
      margin: 0.4rem auto 1rem;
    }

    .chart-box svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .chart-center-val {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .chart-center-val span {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
    }

    .chart-center-val strong {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .distribution-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.5rem;
    }

    .dist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.7rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .dist-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .dist-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dist-card-val {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .dist-card-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
    }

      overflow: hidden;
